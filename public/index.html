<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Sistema de Gerenciamento de Clientes</h1>

    <section class="card">
      <h2 id="titulo-formulario">Cadastrar cliente</h2>

      <form id="form-cliente">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <label for="idade">Idade</label>
        <input type="number" id="idade" min="1" required>

        <div class="botoes-formulario">
          <button type="submit" id="botao-salvar">
            Cadastrar cliente
          </button>

          <button type="button" id="botao-cancelar" hidden>
            Cancelar edição
          </button>
        </div>
      </form>

      <p id="mensagem" role="status"></p>
    </section>


    <section class="card">
      <h2>Lista de clientes</h2>

      <button type="button" id="botao-toggle-clientes">
        Mostrar clientes  
      </button>

      <ul id="lista-clientes" hidden></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
